<article
	class="project-card flex flex-col p-5 border border-borderstrong/60"
	data-account="{{ project.account }}"
	data-lang="{{ project.primary_language }}"
>
	<div class="flex items-start justify-between gap-4 mb-3">
		<div>
			<p class="font-mono text-[0.68rem] text-muted mb-1">{{ project.account }}</p>
			<h3 class="font-display font-semibold text-base text-ink leading-snug">{{ project.name }}</h3>
		</div>
		{% if project.upstream %}
		<span class="shrink-0 text-[0.68rem] leading-tight text-muted text-right">
			Fork of<br /><span class="text-ink">{{ project.upstream.split('/')[0] }}</span>
		</span>
		{% endif %}
	</div>

	<p class="text-muted text-sm mb-4 grow">{{ project.description }}</p>

	<div class="flex items-center justify-between gap-3 pt-3 border-t border-borderstrong/40">
		<span class="lang-badge inline-flex items-center gap-1.5 text-[0.7rem] font-medium text-ink">
			<span class="w-2 h-2 rounded-full" style="background-color: var(--lang-{{ project.primary_language | lower | replace(' ', '-') }}, var(--lang-other))"></span>
			{{ project.primary_language }}
		</span>
		<div class="flex gap-3 text-xs font-medium">
			{% if project.homepage %}<a href="{{ project.homepage }}" target="_blank" rel="noreferrer" class="text-accent hover:text-accentstrong">Live</a>{% endif %}
			{% if project.upstream %}<a href="https://github.com/{{ project.upstream }}" target="_blank" rel="noreferrer" class="text-muted hover:text-ink">Upstream</a>{% endif %}
			<a href="{{ project.url }}" target="_blank" rel="noreferrer" class="text-accent hover:text-accentstrong">Source</a>
		</div>
	</div>
</article>
